<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1c1420">
<meta name="description" content="Luv Booth — a realtime online photo booth for two people, anywhere.">
<title>luv booth · live</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg-deep:#1c1420; --bg-deep2:#2a1c30; --paper:#fbf3e7; --ink:#2b1b2e;
    --gold:#d7a24a; --blush:#e893a8; --film-black:#15101a; --ok:#8fd19e; --err:#e0697e;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; min-height:100vh;
    background:radial-gradient(circle at 50% 0%, var(--bg-deep2), var(--bg-deep) 70%);
    font-family:'Poppins',sans-serif; color:var(--paper);
    display:flex; justify-content:center;
    padding:clamp(18px,5vw,36px) 14px 50px;
  }
  .scene{width:100%; max-width:920px; display:flex; flex-direction:column; align-items:center; gap:24px;}
  .marquee{
    font-family:'Caveat',cursive; font-weight:700; color:var(--gold);
    font-size:clamp(1.9rem,6vw,2.6rem); text-align:center; letter-spacing:0.5px;
    animation:glow 4s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{ text-shadow:0 0 18px rgba(215,162,74,0.35); }
    50%{ text-shadow:0 0 28px rgba(215,162,74,0.6); }
  }

  /* Keyboard-only focus rings: visible for tab navigation, silent for mouse clicks */
  button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible{
    outline:2px solid var(--gold); outline-offset:2px; border-radius:8px;
  }
  button:focus:not(:focus-visible), select:focus:not(:focus-visible){ outline:none; }

  @keyframes riseIn{
    from{ opacity:0; transform:translateY(14px) scale(0.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .gate{
    background:linear-gradient(180deg, rgba(42,28,48,0.85), rgba(21,16,26,0.9));
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-radius:22px; padding:30px 26px; width:100%; max-width:480px; text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(215,162,74,0.2);
    animation:riseIn 0.6s cubic-bezier(.2,.8,.3,1) both;
  }
  .gate-cards{display:flex; gap:16px; width:100%;}
  .gate-card{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:12px;
    background:rgba(251,243,231,0.03); border:1.5px solid rgba(251,243,231,0.18);
    border-radius:18px; padding:28px 16px; cursor:pointer; text-align:center;
    font-family:'Poppins',sans-serif; color:var(--paper);
    transition:border-color .2s ease, background-color .2s ease, transform .15s ease;
  }
  .gate-card:hover{ border-color:rgba(215,162,74,0.55); background:rgba(251,243,231,0.06); transform:translateY(-2px); }
  .gate-card:active{ transform:scale(0.98) translateY(0); }
  .gate-icon{width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none;}
  .gate-icon.blush{ background:rgba(232,147,168,0.22); }
  .gate-icon.gold{ background:rgba(215,162,74,0.22); }
  .gate-icon svg{ width:22px; height:22px; }
  .gate-card-title{ font-weight:700; font-size:1.2rem; }
  .gate-card-sub{ display:flex; align-items:center; gap:4px; font-size:0.78rem; color:rgba(251,243,231,0.6); }
  .gate-card-sub svg{ width:12px; height:12px; }
  @media (max-width: 480px){
    .gate-cards{ flex-direction:column; }
  }
  .join-step{display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; max-width:280px; margin:0 auto;}
  .gate-footnote{font-size:0.72rem; color:rgba(251,243,231,0.4); margin-top:20px; line-height:1.4;}
  .gate input{
    width:100%; text-align:center; letter-spacing:4px; text-transform:uppercase;
    font-family:'Poppins',sans-serif; font-weight:600; font-size:1.1rem;
    padding:12px; border-radius:12px; border:1.5px solid rgba(215,162,74,0.4);
    background:rgba(251,243,231,0.05); color:var(--paper); margin:0;
    transition:border-color .2s ease, background-color .2s ease;
  }
  .gate input:focus{ outline:none; border-color:var(--gold); background:rgba(251,243,231,0.09); }
  .gate input.invalid{ border-color:var(--err); animation:shake 0.4s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-6px); }
    40%{ transform:translateX(5px); }
    60%{ transform:translateX(-4px); }
    80%{ transform:translateX(3px); }
  }
  .error-msg{color:var(--err); font-size:0.78rem; margin-top:8px; min-height:1em;}

  button, select{
    font-family:'Poppins',sans-serif; font-size:0.85rem; font-weight:600;
    border:none; border-radius:999px; padding:11px 18px; cursor:pointer;
    transition:transform .15s ease, box-shadow .2s ease, filter .2s ease, background-color .2s ease, border-color .2s ease;
  }
  button:hover:not(:disabled){ filter:brightness(1.08); transform:translateY(-1px); }
  button:active:not(:disabled){transform:scale(0.96) translateY(0);}
  button:disabled{opacity:0.4; cursor:not-allowed;}
  .btn-primary{background:linear-gradient(180deg, #edaabc, var(--blush)); color:var(--film-black); width:100%; box-shadow:0 6px 18px rgba(232,147,168,0.25);}
  .btn-gold{background:linear-gradient(180deg, #e7b869, var(--gold)); color:var(--film-black); box-shadow:0 6px 18px rgba(215,162,74,0.25);}
  .btn-ghost{background:transparent; color:var(--paper); border:1.5px solid rgba(251,243,231,0.3); width:100%;}
  .btn-ghost:hover:not(:disabled){ border-color:rgba(251,243,231,0.55); background:rgba(251,243,231,0.05); }
  .btn-small{padding:6px 12px; font-size:0.72rem;}
  .btn-reconnect{background:linear-gradient(180deg, #f0c17a, var(--gold)); color:var(--film-black); display:none;}
  .btn-reconnect.show{display:inline-block;}

  select{
    appearance:none; -webkit-appearance:none;
    background:var(--paper) url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2210%22 height=%226%22><path d=%22M0 0l5 6 5-6z%22 fill=%22%232b1b2e%22/></svg>') no-repeat right 14px center;
    color:var(--ink); padding-right:32px;
  }

  .layout{width:100%; display:flex; gap:28px; justify-content:center; flex-wrap:wrap; align-items:flex-start;}
  .booth-card{
    background:linear-gradient(180deg, rgba(42,28,48,0.8), rgba(21,16,26,0.92));
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-radius:24px; padding:20px; width:100%; max-width:400px;
    box-shadow:0 24px 60px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(215,162,74,0.25); position:relative;
  }
  .room-tag{display:flex; align-items:center; justify-content:center; gap:8px; font-size:0.78rem; color:rgba(251,243,231,0.7); margin-bottom:6px; flex-wrap:wrap; text-align:center;}
  .dot{width:8px; height:8px; border-radius:50%; background:#c0576f; flex:none; transition:background-color .3s ease;}
  .dot.live{background:var(--ok); box-shadow:0 0 0 0 rgba(143,209,158,0.6); animation:pulse-ring 1.8s ease-out infinite;}
  .dot.waiting{animation:pulse-soft 1.6s ease-in-out infinite;}
  @keyframes pulse-ring{
    0%{ box-shadow:0 0 0 0 rgba(143,209,158,0.55); }
    70%{ box-shadow:0 0 0 7px rgba(143,209,158,0); }
    100%{ box-shadow:0 0 0 0 rgba(143,209,158,0); }
  }
  @keyframes pulse-soft{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.45; transform:scale(0.85); }
  }
  .code-row{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
  .code-badge{background:rgba(215,162,74,0.15); border:1px solid var(--gold); color:var(--gold); padding:2px 10px; border-radius:999px; font-weight:600; letter-spacing:2px; font-size:0.9rem;}
  .copy-btn{background:rgba(251,243,231,0.1); color:var(--paper); padding:4px 10px; font-size:0.68rem; border-radius:999px;}
  .copy-btn:hover:not(:disabled){ background:rgba(251,243,231,0.18); }

  .viewfinder{position:relative; width:100%; aspect-ratio:4/3; border-radius:16px; overflow:hidden; background:#000; border:3px solid var(--gold); display:flex; box-shadow:0 0 0 1px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.4);}
  .half{position:relative; width:50%; height:100%; overflow:hidden; background:#050505;}
  .half video{width:100%; height:100%; object-fit:cover; display:block;}
  .half.mirror video{transform:scaleX(-1);}
  .divider{width:3px; background:var(--gold); flex:none;}
  .waiting-label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Caveat',cursive; font-size:1.15rem; color:rgba(251,243,231,0.6); text-align:center; padding:10px; line-height:1.3; animation:breathe 2.6s ease-in-out infinite;}
  @keyframes breathe{
    0%,100%{ opacity:0.55; }
    50%{ opacity:0.95; }
  }
  .countdown{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Caveat',cursive; font-size:clamp(3.5rem,15vw,6rem); color:#fff; text-shadow:0 4px 20px rgba(0,0,0,0.6); opacity:0; pointer-events:none; z-index:5;}
  .countdown.show{opacity:1; animation:countPop 0.8s cubic-bezier(.34,1.56,.64,1);}
  @keyframes countPop{
    0%{ transform:scale(0.4); opacity:0; }
    35%{ transform:scale(1.2); opacity:1; }
    60%{ transform:scale(0.95); }
    100%{ transform:scale(1); opacity:1; }
  }
  .flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:6;}
  .flash.pop{animation:flashpop 300ms ease-out;}
  @keyframes flashpop{0%{opacity:0.9;} 100%{opacity:0;}}

  .status-line{text-align:center; font-family:'Caveat',cursive; font-size:1.2rem; color:var(--blush); margin-top:10px; min-height:24px;}
  .controls{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; justify-content:center;}
  .hint{text-align:center; font-size:0.72rem; color:rgba(251,243,231,0.45); margin:14px 4px 0; line-height:1.5;}
  .leave-row{text-align:center; margin-top:10px;}
  .leave-link{background:none; border:none; color:rgba(251,243,231,0.4); font-size:0.7rem; text-decoration:underline; padding:4px; width:auto;}
  .leave-link:hover{ color:rgba(251,243,231,0.7); }

  .strip-wrap{display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; max-width:260px;}
  #stripCanvas{border-radius:14px; box-shadow:0 18px 40px rgba(0,0,0,0.45); max-width:230px; width:100%; height:auto; transition:box-shadow .3s ease;}
  #stripCanvas.celebrate{ animation:celebrate 700ms cubic-bezier(.34,1.56,.64,1); }
  @keyframes celebrate{
    0%{ transform:scale(1); }
    45%{ transform:scale(1.06); box-shadow:0 22px 50px rgba(215,162,74,0.35); }
    100%{ transform:scale(1); }
  }
  .strip-wrap .btn-gold{width:100%; max-width:230px;}
  .theme-picker{display:flex; flex-direction:column; align-items:center; gap:5px; width:100%; max-width:230px;}
  .theme-label{font-size:0.68rem; letter-spacing:1.5px; text-transform:uppercase; color:rgba(251,243,231,0.45);}
  .theme-select{width:100%;}

  @media (max-width: 480px){
    .controls{ flex-direction:column; }
    .controls button, .controls select{ width:100%; }
  }
  @media (max-width: 380px){
    .gate{ padding:24px 18px; }
    .booth-card{ padding:16px; }
    .marquee{ letter-spacing:0; }
  }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }
</style>
</head>
<body>
<div class="scene">
  <div class="marquee">✦ luv booth · live ✦</div>

  <div class="gate" id="gate">
    <div class="gate-cards" id="gateCards">
      <button class="gate-card" id="createCard" type="button">
        <span class="gate-icon blush" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#7a4456" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.3"/></svg>
        </span>
        <span class="gate-card-title">Create</span>
        <span class="gate-card-sub">a new room
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </span>
      </button>
      <button class="gate-card" id="joinCard" type="button">
        <span class="gate-icon gold" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5c4111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 5l3 3M18 3l3 3"/></svg>
        </span>
        <span class="gate-card-title">Join</span>
        <span class="gate-card-sub">with her code
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </span>
      </button>
    </div>

    <div class="join-step" id="joinStep" style="display:none;">
      <input id="roomInput" placeholder="ENTER THEIR CODE" maxlength="8" autocomplete="off" autocapitalize="characters">
      <button class="btn-primary" id="joinConfirmBtn">join room</button>
      <button class="leave-link" id="joinBackBtn" type="button">back</button>
    </div>

    <p class="gate-footnote">no accounts, nothing saved — just the two of you</p>
    <div class="error-msg" id="gateError" role="alert"></div>
  </div>

  <div class="layout" id="boothLayout" style="display:none;">
    <div class="booth-card">
      <div class="room-tag"><span class="dot" id="statusDot"></span><span id="statusText" aria-live="polite">connecting…</span></div>
      <div class="code-row" id="codeRow" style="display:none;">
        <button class="copy-btn" id="copyBtn" type="button">copy code</button>
      </div>
      <div class="viewfinder">
        <div class="half mirror"><video id="localVideo" autoplay playsinline muted></video></div>
        <div class="divider"></div>
        <div class="half" id="remoteHalf">
          <video id="remoteVideo" autoplay playsinline></video>
          <div class="waiting-label" id="waitingLabel">waiting for them<br>to join…</div>
        </div>
        <div id="countdown" class="countdown">3</div>
        <div id="flash" class="flash"></div>
      </div>
      <div class="status-line" id="statusLine" aria-live="polite">say cheese whenever you're ready</div>
      <div class="controls">
        <button class="btn-primary" id="startBtn" disabled>📸 start strip</button>
        <select id="filterSelect">
          <option value="none">no filter</option>
          <option value="grayscale(1) contrast(1.1)">black &amp; white</option>
          <option value="sepia(0.55) saturate(1.3)">sepia</option>
          <option value="saturate(1.4) contrast(1.05) brightness(1.05)">warm pop</option>
        </select>
        <button class="btn-ghost" id="resetBtn">reset</button>
        <button class="btn-reconnect" id="reconnectBtn" type="button">reconnect</button>
      </div>
      <p class="hint">Photos capture both of you at once. Leaving or refreshing ends the room — you'd start a fresh one.</p>
      <div class="leave-row"><button class="leave-link" id="leaveBtn" type="button">leave room</button></div>
    </div>

    <div class="strip-wrap">
      <div class="theme-picker">
        <label for="themeSelect" class="theme-label">strip style</label>
        <select id="themeSelect" class="theme-select"></select>
      </div>
      <canvas id="stripCanvas" width="330" height="1000"></canvas>
      <button class="btn-gold" id="downloadBtn" disabled>⬇ download strip</button>
    </div>
  </div>
</div>

<script>
/* ---------------- Room gate ---------------- */
const gate = document.getElementById('gate');
const gateCards = document.getElementById('gateCards');
const joinStep = document.getElementById('joinStep');
const roomInput = document.getElementById('roomInput');
const createCard = document.getElementById('createCard');
const joinCard = document.getElementById('joinCard');
const joinConfirmBtn = document.getElementById('joinConfirmBtn');
const joinBackBtn = document.getElementById('joinBackBtn');
const gateError = document.getElementById('gateError');
const boothLayout = document.getElementById('boothLayout');
const codeRow = document.getElementById('codeRow');
const copyBtn = document.getElementById('copyBtn');
const leaveBtn = document.getElementById('leaveBtn');

let currentRoomCode = null;
let isHost = null;

function randomCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for(let i=0;i<5;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

function showGateError(msg){
  gateError.textContent = msg;
}

function showJoinStep(show){
  gateCards.style.display = show ? 'none' : 'flex';
  joinStep.style.display = show ? 'flex' : 'none';
  showGateError('');
  if(show) roomInput.focus();
}

createCard.addEventListener('click', ()=>{
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showGateError('This browser can\'t access the camera here — try HTTPS or a modern browser, then reload.');
    return;
  }
  showGateError('');
  const code = randomCode();
  currentRoomCode = code;
  isHost = true;
  gate.style.display = 'none';
  boothLayout.style.display = 'flex';
  startAsHost(code);
});

joinCard.addEventListener('click', ()=> showJoinStep(true));
joinBackBtn.addEventListener('click', ()=> showJoinStep(false));

joinConfirmBtn.addEventListener('click', ()=>{
  const code = roomInput.value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!code){
    showGateError('Type in the code they shared with you.');
    roomInput.classList.remove('invalid');
    void roomInput.offsetWidth;
    roomInput.classList.add('invalid');
    roomInput.focus();
    return;
  }
  showGateError('');
  roomInput.classList.remove('invalid');
  currentRoomCode = code;
  isHost = false;
  gate.style.display = 'none';
  boothLayout.style.display = 'flex';
  startAsGuest(code);
});
roomInput.addEventListener('animationend', ()=> roomInput.classList.remove('invalid'));

roomInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') joinConfirmBtn.click(); });

/* ---------------- Elements ---------------- */
const localVideo = document.getElementById('localVideo');
const remoteVideo = document.getElementById('remoteVideo');
const waitingLabel = document.getElementById('waitingLabel');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const statusLine = document.getElementById('statusLine');
const countdownEl = document.getElementById('countdown');
const flashEl = document.getElementById('flash');
const startBtn = document.getElementById('startBtn');
const resetBtn = document.getElementById('resetBtn');
const reconnectBtn = document.getElementById('reconnectBtn');
const filterSelect = document.getElementById('filterSelect');
const downloadBtn = document.getElementById('downloadBtn');
const themeSelect = document.getElementById('themeSelect');
const stripCanvas = document.getElementById('stripCanvas');
const stripCtx = stripCanvas.getContext('2d');

function applyLiveFilter(){
  const f = filterSelect.value;
  localVideo.style.filter = f;
  remoteVideo.style.filter = f;
}
filterSelect.addEventListener('change', applyLiveFilter);
applyLiveFilter();

const PHOTO_W = 260, PHOTO_H = 195, SIDE = 20, GAP = 14, TOP = 56, BOTTOM = 56;

/* ---------------- Strip themes ----------------
   Only 3 themes now, each a plain data object: colors, an optional bold
   header line (+ rule), an optional thick outer border, an optional
   "receipt" perforation between photos, and a photo-frame border. Draw
   functions below read from the active theme rather than branching on its
   id. Each theme's 3 slots either show a captured photo or, until then, a
   shared illustrated sky/cloud/hill placeholder. */
const THEMES = [
  {
    id: 'classic',
    label: 'Classic',
    background: '#ffffff',
    ink: '#1a1a1a',
    accent: '#1a1a1a',
    headerText: '',
    headerFont: "800 22px 'Poppins', sans-serif",
    headerRule: false,
    borderWidth: 0,
    perforation: false,
    photoBorder: { color: '#1a1a1a', width: 3 },
    captionFont: "800 22px 'Poppins', sans-serif"
  },
  {
    id: 'receipt',
    label: 'Receipt',
    background: '#ffffff',
    ink: '#000000',
    accent: '#000000',
    headerText: 'RECEIPT',
    headerFont: "900 26px 'Poppins', sans-serif",
    headerRule: true,
    borderWidth: 6,
    perforation: true,
    photoBorder: null,
    captionFont: "800 20px 'Poppins', sans-serif"
  },
  {
    id: 'noir',
    label: 'Noir',
    background: '#000000',
    ink: '#ffffff',
    accent: '#ffffff',
    headerText: '',
    headerFont: "800 22px 'Poppins', sans-serif",
    headerRule: false,
    borderWidth: 0,
    perforation: false,
    photoBorder: { color: '#ffffff', width: 6 },
    captionFont: "800 22px 'Poppins', sans-serif"
  }
];
let currentThemeId = THEMES[0].id;
function getTheme(){ return THEMES.find(t=>t.id===currentThemeId) || THEMES[0]; }

THEMES.forEach(t=>{
  const opt = document.createElement('option');
  opt.value = t.id;
  opt.textContent = t.label;
  themeSelect.appendChild(opt);
});
themeSelect.value = currentThemeId;
themeSelect.addEventListener('change', ()=>{
  currentThemeId = themeSelect.value;
  redrawStrip();
});
let shots = [];
let busy = false;
let connected = false;
let localStream = null;
let peer = null;
let activeCall = null;

function setStatus(text, live, waiting){
  statusText.textContent = text;
  statusDot.classList.toggle('live', !!live);
  statusDot.classList.toggle('waiting', !!waiting && !live);
}

function showReconnect(show){
  reconnectBtn.classList.toggle('show', !!show);
  if(!show){ reconnectBtn.disabled = false; reconnectBtn.textContent = 'reconnect'; }
}

function setCodeBadge(code){
  codeRow.style.display = 'flex';
  const existing = codeRow.querySelector('.code-badge');
  if(existing) existing.remove();
  const badge = document.createElement('span');
  badge.className = 'code-badge';
  badge.textContent = code;
  codeRow.insertBefore(badge, copyBtn);
}

copyBtn.addEventListener('click', async ()=>{
  if(!currentRoomCode) return;
  try{
    await navigator.clipboard.writeText(currentRoomCode);
    copyBtn.textContent = 'copied!';
  }catch(e){
    copyBtn.textContent = currentRoomCode;
  }
  setTimeout(()=>{ copyBtn.textContent = 'copy code'; }, 1500);
});

async function getCamera(){
  if(localStream){ localStream.getTracks().forEach(t=>t.stop()); }
  try{
    localStream = await navigator.mediaDevices.getUserMedia({ video:{facingMode:'user'}, audio:false });
    localVideo.srcObject = localStream;
    return true;
  }catch(e){
    setStatus('camera blocked', false);
    statusLine.textContent = "camera blocked — check your browser's site settings and refresh";
    return false;
  }
}

function wireCall(call){
  activeCall = call;
  call.on('stream', (remoteStream)=>{
    remoteVideo.srcObject = remoteStream;
    waitingLabel.style.display = 'none';
    connected = true;
    setStatus('connected 💛', true);
    startBtn.disabled = false;
    statusLine.textContent = "you're both in the frame — say cheese!";
    showReconnect(false);
  });
  call.on('close', ()=>{
    connected = false;
    setStatus('they left the room', false);
    startBtn.disabled = true;
    waitingLabel.style.display = 'flex';
    waitingLabel.textContent = 'connection ended';
    statusLine.textContent = 'tap reconnect below if they\'re coming back';
    showReconnect(true);
  });
  call.on('error', ()=>{
    setStatus('connection hiccup', false);
    statusLine.textContent = 'tap reconnect below to try again';
    showReconnect(true);
  });
}

async function startAsHost(code){
  setStatus('setting up your room…', false);
  const ok = await getCamera();
  if(!ok) return;

  peer = new Peer('booth-' + code + '-host');
  peer.on('open', ()=>{
    setCodeBadge(code);
    setStatus('waiting for them to join…', false, true);
  });
  peer.on('call', (call)=>{
    call.answer(localStream);
    wireCall(call);
  });
  peer.on('disconnected', ()=>{
    setStatus('reconnecting…', false, true);
    if(peer && !peer.destroyed) peer.reconnect();
  });
  peer.on('error', (err)=>{
    if(err.type === 'unavailable-id'){
      setStatus('room code taken', false);
      statusLine.textContent = 'that code is already in use — tap leave room and start a fresh one';
    }else{
      setStatus('connection error', false);
      statusLine.textContent = 'tap reconnect below to try again';
      showReconnect(true);
    }
  });
}

async function startAsGuest(code){
  setStatus('connecting to room ' + code + '…', false, true);
  const ok = await getCamera();
  if(!ok) return;

  peer = new Peer();
  peer.on('open', ()=>{
    const call = peer.call('booth-' + code + '-host', localStream);
    if(!call){
      setStatus('room not found', false);
      statusLine.textContent = 'double-check the code with them, or tap leave room to try again';
      return;
    }
    wireCall(call);
  });
  peer.on('disconnected', ()=>{
    setStatus('reconnecting…', false, true);
    if(peer && !peer.destroyed) peer.reconnect();
  });
  peer.on('error', (err)=>{
    setStatus('connection error', false);
    statusLine.textContent = 'check the code with them, or tap reconnect to try again';
    showReconnect(true);
  });
}

async function attemptReconnect(){
  reconnectBtn.disabled = true;
  reconnectBtn.textContent = 'reconnecting…';
  try{
    if(activeCall){ try{ activeCall.close(); }catch(e){} activeCall = null; }
    if(peer){ try{ peer.destroy(); }catch(e){} peer = null; }
    connected = false;
    await wait(400);
    if(isHost) await startAsHost(currentRoomCode);
    else await startAsGuest(currentRoomCode);
  }catch(e){
    setStatus('connection error', false);
    statusLine.textContent = 'tap reconnect below to try again';
  }finally{
    reconnectBtn.disabled = false;
    reconnectBtn.textContent = 'reconnect';
  }
}
reconnectBtn.addEventListener('click', attemptReconnect);

function teardownAndReturnToGate(){
  if(activeCall){ try{ activeCall.close(); }catch(e){} activeCall = null; }
  if(peer){ try{ peer.destroy(); }catch(e){} peer = null; }
  if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream = null; }
  connected = false;
  shots = [];
  currentRoomCode = null;
  isHost = null;
  boothLayout.style.display = 'none';
  gate.style.display = 'block';
  roomInput.value = '';
  showJoinStep(false);
  codeRow.style.display = 'none';
  waitingLabel.style.display = 'flex';
  waitingLabel.innerHTML = 'waiting for them<br>to join…';
  startBtn.disabled = true;
  downloadBtn.disabled = true;
  statusLine.textContent = "say cheese whenever you're ready";
  showReconnect(false);
  statusDot.classList.remove('live', 'waiting');
  redrawStrip();
}

leaveBtn.addEventListener('click', teardownAndReturnToGate);
window.addEventListener('beforeunload', ()=>{
  if(peer) try{ peer.destroy(); }catch(e){}
});

/* ---------------- Strip building ---------------- */
function sizeStripCanvas(){
  stripCanvas.width = SIDE + PHOTO_W + SIDE;
  stripCanvas.height = TOP + 3 * PHOTO_H + 2 * GAP + BOTTOM;
}
sizeStripCanvas();

function drawSkyPlaceholder(ctx, x, y, w, h){
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  const grad = ctx.createLinearGradient(0, y, 0, y + h);
  grad.addColorStop(0, '#bfe3fb');
  grad.addColorStop(1, '#eaf6fd');
  ctx.fillStyle = grad;
  ctx.fillRect(x, y, w, h);
  const cx = x + w * 0.5, cy = y + h * 0.22;
  ctx.fillStyle = '#ffffff';
  [[-0.14,0,0.16],[0,-0.05,0.20],[0.15,0.02,0.15],[0.05,0.05,0.13],[-0.05,0.05,0.12]].forEach(([dx,dy,r])=>{
    ctx.beginPath();
    ctx.arc(cx + dx*w, cy + dy*h, r*w, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.fillStyle = '#c3dd8d';
  ctx.beginPath();
  ctx.moveTo(x, y + h*0.78);
  ctx.quadraticCurveTo(x + w*0.25, y + h*0.68, x + w*0.5, y + h*0.75);
  ctx.quadraticCurveTo(x + w*0.75, y + h*0.82, x + w, y + h*0.72);
  ctx.lineTo(x + w, y + h);
  ctx.lineTo(x, y + h);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#8bab1e';
  ctx.beginPath();
  ctx.moveTo(x, y + h*0.88);
  ctx.quadraticCurveTo(x + w*0.3, y + h*0.78, x + w*0.55, y + h*0.85);
  ctx.quadraticCurveTo(x + w*0.8, y + h*0.92, x + w, y + h*0.82);
  ctx.lineTo(x + w, y + h);
  ctx.lineTo(x, y + h);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawPerforation(theme){
  stripCtx.save();
  stripCtx.strokeStyle = theme.ink;
  stripCtx.globalAlpha = 0.5;
  stripCtx.setLineDash([4, 3]);
  stripCtx.lineWidth = 1.5;
  for(let i = 0; i < 2; i++){
    const y = TOP + (i + 1) * PHOTO_H + i * GAP + GAP / 2;
    stripCtx.beginPath();
    stripCtx.moveTo(SIDE + 10, y);
    stripCtx.lineTo(SIDE + PHOTO_W - 10, y);
    stripCtx.stroke();
  }
  stripCtx.restore();
}

function drawStripBase(){
  const theme = getTheme();
  stripCtx.clearRect(0, 0, stripCanvas.width, stripCanvas.height);
  stripCtx.fillStyle = theme.background;
  stripCtx.fillRect(0, 0, stripCanvas.width, stripCanvas.height);
  if(theme.headerText){
    stripCtx.fillStyle = theme.ink;
    stripCtx.font = theme.headerFont;
    stripCtx.textAlign = 'center';
    stripCtx.fillText(theme.headerText, stripCanvas.width / 2, 34);
    if(theme.headerRule){
      stripCtx.strokeStyle = theme.ink;
      stripCtx.lineWidth = 3;
      stripCtx.beginPath();
      stripCtx.moveTo(14, 46);
      stripCtx.lineTo(stripCanvas.width - 14, 46);
      stripCtx.stroke();
    }
  }
  if(theme.perforation) drawPerforation(theme);
  if(theme.borderWidth){
    stripCtx.strokeStyle = theme.ink;
    stripCtx.lineWidth = theme.borderWidth;
    stripCtx.strokeRect(theme.borderWidth / 2, theme.borderWidth / 2, stripCanvas.width - theme.borderWidth, stripCanvas.height - theme.borderWidth);
  }
}

function drawSlot(index, imgCanvas){
  const theme = getTheme();
  const x = SIDE, y = TOP + index * (PHOTO_H + GAP);
  if(imgCanvas){
    stripCtx.drawImage(imgCanvas, x, y, PHOTO_W, PHOTO_H);
    stripCtx.fillStyle = theme.accent;
    stripCtx.fillRect(x + PHOTO_W / 2 - 1, y, 2, PHOTO_H);
  }else{
    drawSkyPlaceholder(stripCtx, x, y, PHOTO_W, PHOTO_H);
  }
  if(theme.photoBorder){
    const pb = theme.photoBorder;
    stripCtx.strokeStyle = pb.color;
    stripCtx.lineWidth = pb.width;
    stripCtx.strokeRect(x + pb.width / 2, y + pb.width / 2, PHOTO_W - pb.width, PHOTO_H - pb.width);
  }
}

function drawFooter(){
  const theme = getTheme();
  stripCtx.fillStyle = theme.ink;
  stripCtx.textAlign = 'center';
  stripCtx.font = theme.captionFont;
  stripCtx.fillText('luv booth.', stripCanvas.width / 2, stripCanvas.height - 22);
}

function redrawStrip(){
  drawStripBase();
  for(let i = 0; i < 3; i++){
    drawSlot(i, i < shots.length ? shots[i] : null);
  }
  drawFooter();
}

function drawVideoCover(ctx, video, x, y, w, h, mirror){
  const vw = video.videoWidth, vh = video.videoHeight;
  if(!vw || !vh) return;
  const targetRatio = w / h, srcRatio = vw / vh;
  let sx, sy, sw, sh;
  if(srcRatio > targetRatio){ sh = vh; sw = vh*targetRatio; sx=(vw-sw)/2; sy=0; }
  else{ sw = vw; sh = vw/targetRatio; sx=0; sy=(vh-sh)/2; }
  ctx.save();
  if(mirror){
    ctx.translate(x + w, y);
    ctx.scale(-1, 1);
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
  }else{
    ctx.drawImage(video, sx, sy, sw, sh, x, y, w, h);
  }
  ctx.restore();
}

function capturePhoto(filterValue){
  const c = document.createElement('canvas');
  c.width = PHOTO_W; c.height = PHOTO_H;
  const ctx = c.getContext('2d');
  ctx.filter = filterValue === 'none' ? 'none' : filterValue;
  const halfW = PHOTO_W / 2;
  drawVideoCover(ctx, localVideo, 0, 0, halfW, PHOTO_H, true);
  drawVideoCover(ctx, remoteVideo, halfW, 0, halfW, PHOTO_H, false);
  ctx.filter = 'none';
  return c;
}


let audioCtx = null;
function playShutterSound(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(1200, t);
    osc.frequency.exponentialRampToValueAtTime(300, t + 0.08);
    gain.gain.setValueAtTime(0.15, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.1);
  }catch(e){ /* audio unavailable — the visual flash still plays */ }
}

function flash(){
  flashEl.classList.remove('pop');
  void flashEl.offsetWidth;
  flashEl.classList.add('pop');
  playShutterSound();
}
function wait(ms){ return new Promise(r=>setTimeout(r, ms)); }

async function runCountdown(seconds){
  for(let i=seconds;i>0;i--){
    countdownEl.textContent = i;
    countdownEl.classList.add('show');
    await wait(650);
    countdownEl.classList.remove('show');
    await wait(150);
  }
}

async function startSession(){
  if(busy || !connected) return;
  busy = true;
  startBtn.disabled = true;
  downloadBtn.disabled = true;
  shots = [];
  redrawStrip();

  for(let i=0;i<4;i++){
    statusLine.textContent = `photo ${i+1} of 4 — get ready!`;
    await runCountdown(3);
    flash();
    const shot = capturePhoto(filterSelect.value);
    shots.push(shot);
    redrawStrip();
    statusLine.textContent = `photo ${i+1} captured 🤍`;
    await wait(500);
  }
  statusLine.textContent = "all done! download your strip below";
  downloadBtn.disabled = false;
  startBtn.disabled = false;
  busy = false;
  stripCanvas.classList.remove('celebrate');
  void stripCanvas.offsetWidth;
  stripCanvas.classList.add('celebrate');
}

startBtn.addEventListener('click', startSession);
resetBtn.addEventListener('click', ()=>{
  shots = [];
  redrawStrip();
  downloadBtn.disabled = true;
  statusLine.textContent = connected ? "you're both in the frame — say cheese!" : "waiting to connect…";
});
downloadBtn.addEventListener('click', ()=>{
  const link = document.createElement('a');
  link.download = 'luv-booth-live-strip.png';
  link.href = stripCanvas.toDataURL('image/png');
  link.click();
});

redrawStrip();
</script>
