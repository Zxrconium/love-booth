name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main", "claude/love-booth-photobooth-78k8kr"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject Metered TURN credentials
        env:
          METERED_TURN_USERNAME: ${{ secrets.METERED_TURN_USERNAME }}
          METERED_TURN_CREDENTIAL: ${{ secrets.METERED_TURN_CREDENTIAL }}
        run: |
          if [ -z "$METERED_TURN_USERNAME" ] || [ -z "$METERED_TURN_CREDENTIAL" ]; then
            echo "::warning::METERED_TURN_USERNAME/METERED_TURN_CREDENTIAL repo secrets are not set — deploying with TURN placeholders still in index.html, so room connections will fall back to STUN-only."
          fi
          sed -i \
            -e "s/__METERED_TURN_USERNAME__/${METERED_TURN_USERNAME}/g" \
            -e "s/__METERED_TURN_CREDENTIAL__/${METERED_TURN_CREDENTIAL}/g" \
            index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
